<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Blood Donation Management System</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>

<header class="header">
    <div class="logo">🩸 Blood Donation System</div>
</header>

<div class="register-container">
    <div class="register-card">

        <div class="icon">🩸</div>

        <h2>Donor Registration</h2>
        <p>Register to donate blood and save lives</p>

        <form>
            <div class="row">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter full name">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="example@email.com">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" placeholder="+880 1XXXXXXXXX">
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text" placeholder="City">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Blood Group</label>
                    <select>
                        <option>Select</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Blood Type</label>
                    <select>
                        <option>Select</option>
                        <option>Whole Blood</option>
                        <option>Plasma</option>
                        <option>Platelet</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create password">
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm password">
                </div>
            </div>

            <button class="btn-register">Register</button>
        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>
</div>

<footer class="footer">
    © 2025 Blood Donation Management System
</footer>

</body>
</html>
